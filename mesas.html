<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organização de Mesas — Paula & Sabatin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--g:#99CD85;--gl:#c4e8a8;--dark:#0c1a08;--card:#142010;--gold:#d4a853;--goldl:#f0cc7a;--honor-c:#c44;--border:rgba(153,205,133,.18);--cream:#f7f5ee}
body{background:var(--dark);color:var(--cream);font-family:'Jost',sans-serif;min-height:100vh;overflow-x:hidden}
header{padding:1rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;background:rgba(12,26,8,.96);position:sticky;top:0;z-index:50;backdrop-filter:blur(10px)}
.logo{font-family:'Cinzel',serif;font-size:1rem;color:var(--g);letter-spacing:.08em}
.logo span{color:var(--gold);font-size:.65rem;display:block;letter-spacing:.12em;font-family:'Jost',sans-serif;font-weight:200}
.header-actions{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{padding:.5rem 1rem;border:1px solid var(--border);background:transparent;color:rgba(247,245,238,.65);font-family:'Jost',sans-serif;font-size:.74rem;letter-spacing:.06em;cursor:pointer;border-radius:4px;transition:all .2s;white-space:nowrap}
.btn:hover{border-color:var(--g);color:var(--g)}
.btn-g{background:var(--g);border-color:var(--g);color:#0c1a08;font-weight:500}
.btn-g:hover{background:#7ab865;color:#0c1a08}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#0c1a08;font-weight:500}
.btn-gold:hover{background:var(--goldl)}
.app{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 55px)}
@media(max-width:780px){.app{grid-template-columns:1fr}}

/* SIDEBAR */
.sidebar{background:rgba(18,28,14,.9);border-right:1px solid var(--border);padding:1rem;overflow-y:auto;max-height:calc(100vh - 55px);position:sticky;top:55px}
@media(max-width:780px){.sidebar{position:static;max-height:260px;border-right:none;border-bottom:1px solid var(--border)}}
.sb-title{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.1em;color:var(--g);margin-bottom:.7rem;display:flex;justify-content:space-between;align-items:center}
.sb-count{font-size:.68rem;font-weight:200;color:rgba(153,205,133,.45)}
.search-box{width:100%;background:rgba(153,205,133,.05);border:1px solid var(--border);color:var(--cream);padding:.45rem .75rem;font-size:.78rem;border-radius:4px;outline:none;margin-bottom:.7rem;transition:border-color .2s;font-family:'Jost',sans-serif}
.search-box:focus{border-color:var(--g)}
.search-box::placeholder{color:rgba(247,245,238,.25)}
.guest-list{display:flex;flex-direction:column;gap:.28rem}
.gi{padding:.45rem .65rem;background:rgba(153,205,133,.03);border:1px solid var(--border);border-radius:4px;cursor:grab;transition:all .18s;position:relative;user-select:none}
.gi.assigned{opacity:.35;pointer-events:none;background:transparent}
.gi.dragging{opacity:.45;transform:scale(.95)}
.gi:hover:not(.assigned){border-color:var(--g);background:rgba(153,205,133,.08)}
.gi-name{font-size:.8rem;font-weight:400;color:var(--cream);padding-right:18px}
.gi-meta{font-size:.65rem;font-weight:200;color:rgba(247,245,238,.38);margin-top:.1rem;display:flex;gap:.4rem;flex-wrap:wrap}
.gi-comp{color:rgba(153,205,133,.55)}
.badge{font-size:.58rem;padding:.1rem .3rem;border-radius:2px;font-weight:500}
.b-amigo{background:rgba(100,149,237,.14);color:#90b4f8}
.b-colega{background:rgba(255,165,0,.12);color:#ffa040}
.b-familia{background:rgba(153,205,133,.12);color:var(--g)}
.b-tio{background:rgba(200,150,255,.12);color:#c896ff}
.b-primo{background:rgba(255,182,193,.12);color:#ffaab8}
.b-padrinho{background:rgba(212,168,83,.18);color:var(--gold)}
.b-outro{background:rgba(153,205,133,.07);color:rgba(153,205,133,.6)}
.couple-tag{position:absolute;right:.4rem;top:.4rem;font-size:.68rem;opacity:.55}
.assigned-to{font-size:.6rem;color:rgba(153,205,133,.5);margin-top:.1rem}

/* SALON */
.salon-wrap{padding:1.2rem;overflow:auto}
.salon-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.8rem}
.stats{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:.3rem}
.stat{font-size:.7rem;font-weight:200;color:rgba(247,245,238,.45)}
.stat strong{color:var(--g);font-weight:500}
.table-config{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.table-config label{font-size:.72rem;color:rgba(247,245,238,.45)}
.table-config input{width:52px;background:rgba(153,205,133,.05);border:1px solid var(--border);color:var(--cream);padding:.3rem .5rem;font-size:.8rem;border-radius:4px;outline:none;text-align:center;font-family:'Jost',sans-serif}
.table-config input:focus{border-color:var(--g)}
.legend{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.leg{display:flex;align-items:center;gap:.4rem;font-size:.68rem;color:rgba(247,245,238,.42)}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.salon-floor{background:rgba(153,205,133,.015);border:1px solid var(--border);border-radius:10px;padding:2rem 1.5rem 2.5rem;position:relative;min-height:500px}
.stage{display:block;margin:0 auto 2.5rem;background:rgba(212,168,83,.07);border:1px solid rgba(212,168,83,.2);border-radius:6px;padding:.35rem 2rem;font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.18em;color:var(--gold);text-align:center;max-width:220px;text-transform:uppercase}
.tables-grid{display:flex;flex-wrap:wrap;gap:2.5rem 2rem;justify-content:center;align-items:flex-start}

/* ── TABLE COMPONENT ── */
.table-wrap{display:flex;flex-direction:column;align-items:center;gap:.4rem}
.table-name-inp{background:transparent;border:none;border-bottom:1px solid rgba(153,205,133,.18);color:var(--cream);font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.1em;text-align:center;width:130px;outline:none;padding:.15rem .3rem;transition:border-color .2s}
.table-name-inp:focus{border-bottom-color:var(--g)}

/* The rectangular table surface */
.table-rect-wrap{position:relative}

.table-surface{border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:.72rem;font-weight:600;letter-spacing:.05em;cursor:pointer;transition:all .2s;border:2px solid;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.table-surface.regular{background:rgba(153,205,133,.07);border-color:rgba(153,205,133,.32);color:var(--g)}
.table-surface.honor{background:rgba(139,26,26,.12);border-color:rgba(196,68,68,.38);color:#e07070}
.table-surface.drag-over{border-color:var(--g);background:rgba(153,205,133,.16);transform:translate(-50%,-50%) scale(1.03)}
.t-count{font-size:.58rem;display:block;font-family:'Jost',sans-serif;font-weight:200;opacity:.65;margin-top:.15rem}

/* ── SEAT + EXTERNAL LABEL ── */
/*
  Each seat is a .seat-unit div positioned absolutely.
  It contains:
    .seat-box  — the visible square/circle
    .seat-name — the name label OUTSIDE, positioned via flex
  The .seat-unit itself is the container; we use flex-direction to
  push the label to the correct side.
*/
.seat-unit{position:absolute;display:flex;align-items:center;justify-content:center}
/* direction variants — label appears on the far side from the table */
.seat-unit.dir-top   {flex-direction:column-reverse; gap:3px}
.seat-unit.dir-bottom{flex-direction:column;         gap:3px}
.seat-unit.dir-left  {flex-direction:row-reverse;    gap:4px}
.seat-unit.dir-right {flex-direction:row;            gap:4px}

.seat-box{width:28px;height:28px;border-radius:4px;border:1px solid rgba(153,205,133,.2);background:rgba(153,205,133,.04);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;position:relative}
.seat-box:hover{border-color:rgba(153,205,133,.5);background:rgba(153,205,133,.1)}
.seat-box.occ     {border-color:rgba(153,205,133,.5);background:rgba(153,205,133,.14)}
.seat-box.occ-hon {border-color:rgba(196,68,68,.55); background:rgba(139,26,26,.18)}
.seat-box.occ-coup{border-color:rgba(240,204,122,.55);background:rgba(212,168,83,.1)}
.seat-box.drag-over{border-color:var(--g);background:rgba(153,205,133,.2)!important}

.seat-name{font-family:'Jost',sans-serif;font-size:.6rem;font-weight:400;white-space:nowrap;line-height:1.2;pointer-events:none;max-width:58px;overflow:hidden;text-overflow:ellipsis}
.seat-name.empty  {color:rgba(247,245,238,.22);font-size:.56rem}
.seat-name.occ    {color:var(--cream)}
.seat-name.occ-hon{color:#e07070}
.seat-name.occ-coup{color:var(--gold)}

/* For top/bottom: label is centered above/below */
.seat-unit.dir-top .seat-name,
.seat-unit.dir-bottom .seat-name{text-align:center}
/* For left/right: label is on the outer side */
.seat-unit.dir-left .seat-name,
.seat-unit.dir-right .seat-name{text-align:center}

.seat-box .seat-tooltip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#081206;border:1px solid var(--border);padding:.3rem .6rem;border-radius:4px;font-size:.66rem;white-space:nowrap;z-index:300;pointer-events:none;opacity:0;transition:opacity .15s;color:var(--cream);box-shadow:0 4px 14px rgba(0,0,0,.6);line-height:1.5}
.seat-box:hover .seat-tooltip{opacity:1}
.seat-box .rm-btn{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:#c44;border:none;color:#fff;font-size:.6rem;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1;z-index:10}
.seat-box.occ:hover .rm-btn,
.seat-box.occ-hon:hover .rm-btn,
.seat-box.occ-coup:hover .rm-btn{display:flex}
.rm-btn:hover{opacity:1!important;transform:scale(1.15)}

/* cap bar */
.cap-bar{width:100px;height:3px;background:rgba(153,205,133,.08);border-radius:2px;overflow:hidden}
.cap-fill{height:100%;border-radius:2px;transition:width .3s}
.cap-txt{font-size:.62rem;color:rgba(247,245,238,.3);font-family:'Jost',sans-serif;margin-top:.1rem;text-align:center}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9998;align-items:center;justify-content:center;padding:1rem}
.modal-bg.open{display:flex!important}
.modal{background:#142010;border:1px solid var(--border);border-radius:10px;padding:1.4rem;max-width:400px;width:100%;max-height:80vh;overflow-y:auto}
.modal h3{font-family:'Cinzel',serif;font-size:.95rem;color:var(--g);margin-bottom:.9rem}
.modal-list{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.9rem}
.mi{padding:.45rem .65rem;background:rgba(153,205,133,.04);border:1px solid var(--border);border-radius:4px;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:space-between}
.mi:hover{border-color:var(--g);background:rgba(153,205,133,.1)}
.mi-name{font-size:.8rem}
.mi-meta{font-size:.65rem;color:rgba(247,245,238,.38)}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--g);color:#0c1a08;padding:.55rem 1rem;border-radius:5px;font-size:.76rem;font-weight:500;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
/* SYNC */
#sync-bar{position:fixed;top:55px;left:0;right:0;z-index:400;padding:.35rem 1.2rem;display:flex;align-items:center;gap:.6rem;font-family:'Jost',sans-serif;font-size:.72rem;font-weight:300;transition:background .4s}
#sync-bar.saved{background:rgba(153,205,133,.1);border-bottom:1px solid rgba(153,205,133,.15);color:rgba(153,205,133,.7)}
#sync-bar.saving{background:rgba(212,168,83,.08);border-bottom:1px solid rgba(212,168,83,.15);color:rgba(212,168,83,.7)}
#sync-bar.error{background:rgba(196,68,68,.08);border-bottom:1px solid rgba(196,68,68,.2);color:rgba(196,68,68,.7)}
.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sync-dot.saved{background:var(--g);animation:pulse-g 2s ease infinite}
.sync-dot.saving{background:var(--gold);animation:pulse-g .6s ease infinite}
.sync-dot.error{background:#c44}
@keyframes pulse-g{0%,100%{opacity:1}50%{opacity:.4}}
.online-count{margin-left:auto;font-size:.68rem;color:rgba(247,245,238,.3)}
/* push content down when sync bar visible */
.app{margin-top:36px}
</style>
</head>
<body>
<header>
  <div class="logo">Paula & Sabatin <span>Organização de Mesas · 29 Agosto 2026</span></div>
  <div class="header-actions">
    <button class="btn" onclick="autoArrange()">✨ Distribuir automaticamente</button>
    <button class="btn" onclick="clearAll()">🗑 Limpar</button>
    <button class="btn btn-gold" onclick="exportExcel()">⬇ Excel</button>
  </div>
</header>

<div id="sync-bar" class="saved">
  <div class="sync-dot saved" id="sync-dot"></div>
  <span id="sync-msg">A conectar ao Firebase...</span>
  <span class="online-count" id="online-count"></span>
</div>
<div class="app">
  <div class="sidebar">
    <div class="sb-title">Convidados <span class="sb-count" id="sb-count">0 por alocar</span></div>
    <input class="search-box" placeholder="Pesquisar..." oninput="filterGuests(this.value)" type="text">
    <div class="guest-list" id="guest-list"></div>
  </div>

  <div class="salon-wrap">
    <div class="salon-hdr">
      <div>
        <div style="font-family:'Cinzel',serif;font-size:.95rem;color:var(--cream);letter-spacing:.06em">Vista do Salão</div>
        <div class="stats">
          <div class="stat">Mesas: <strong id="st-tables">0</strong></div>
          <div class="stat">Alocados: <strong id="st-assigned">0</strong></div>
          <div class="stat">Por alocar: <strong id="st-free">0</strong></div>
          <div class="stat">Total: <strong id="st-total">0</strong></div>
        </div>
      </div>
      <div class="table-config">
        <label>Mesas normais:</label>
        <input type="number" id="tc-input" value="9" min="1" max="20" onchange="rebuildTables()">
        <button class="btn btn-g" style="padding:.3rem .8rem;font-size:.7rem" onclick="rebuildTables()">OK</button>
      </div>
    </div>
    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:rgba(196,68,68,.5);border:1px solid #c44"></div>Mesa de Honra</div>
      <div class="leg"><div class="leg-dot" style="background:rgba(153,205,133,.25);border:1px solid var(--g)"></div>Mesa Normal</div>
      <div class="leg"><div class="leg-dot" style="background:rgba(212,168,83,.25);border:1px solid var(--gold)"></div>Casal</div>
    </div>
    <div class="salon-floor">
      <div class="stage">Palco / Altar</div>
      <div class="tables-grid" id="tables-grid"></div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3 id="modal-title">Escolher convidado</h3>
    <input class="search-box" type="text" placeholder="Pesquisar..." oninput="filterModal(this.value)" id="modal-search">
    <div class="modal-list" id="modal-list"></div>
    <button class="btn" style="width:100%" onclick="closeModal()">Cancelar</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

// State
let tables = [];
let assignment = {}; // guestId → tableId

const hasComp = g => g.comp && g.comp.trim() && g.comp!=='—';

function catBadge(cat){
  const c=cat.toLowerCase();
  if(c.includes('amigo')) return 'b-amigo';
  if(c.includes('colega')) return 'b-colega';
  if(c.includes('noivo')) return 'b-familia';
  if(c.includes('tio')) return 'b-tio';
  if(c.includes('primo')) return 'b-primo';
  if(c.includes('padrinho')) return 'b-padrinho';
  if(c.includes('família')||c.includes('familia')) return 'b-familia';
  return 'b-outro';

// ─────────────── TABLE GEOMETRY ───────────────
// Returns positions for seats around a rectangle
// Each pos: {x, y, dir} where x,y = top-left of the seat-unit div
// dir = 'top'|'bottom'|'left'|'right'  (direction label goes away from table)
function getSeatPositions(capacity, tw, th, cx, cy){
  const sw=28, gap=5, lblH=16, lblW=60;
  const pos=[];
  if(capacity===4){
    // Honor: 2 top, 2 bottom
    const topY = cy - th/2 - gap - sw - lblH; // unit top: label(16) + gap(3) + seat(28)
    const botY = cy + th/2 + gap;
    const xs=[cx-30, cx+2];
    xs.forEach(x=>pos.push({x, y:topY, dir:'top'}));
    xs.forEach(x=>pos.push({x, y:botY, dir:'bottom'}));
  } else {
    // 10 seats: 4 top, 4 bottom, 1 left, 1 right
    const nTop=4, nBot=4;
    const topY = cy - th/2 - gap - sw - lblH;
    const botY = cy + th/2 + gap;
    const spacing = (tw - sw) / (nTop-1);
    for(let i=0;i<nTop;i++) pos.push({x: cx - tw/2 + i*spacing, y:topY, dir:'top'});
    for(let i=0;i<nBot;i++) pos.push({x: cx - tw/2 + i*spacing, y:botY, dir:'bottom'});
    // left: label goes further left, so unit at leftX
    pos.push({x: cx - tw/2 - gap - sw - lblW, y: cy-sw/2, dir:'left'});
    // right: label goes further right
    pos.push({x: cx + tw/2 + gap, y: cy-sw/2, dir:'right'});
  }
  return pos;
}

// ─────────────── BUILD TABLES ───────────────
function buildTables(nRegular){
  tables=[];
  // Honor: Sabatin, Paula, Alisson, Duda
  tables.push({id:'honor', name:'Mesa de Honra', type:'honor', cap:4,
    seats:[100,101,15,null], // Paula, Sabatin, Alisson, Duda(via auto)
    fixed:[100,101,15] // these can't be removed
  });
  for(let i=1;i<=nRegular;i++)
    tables.push({id:'t'+i, name:'Mesa '+i, type:'regular', cap:10, seats:Array(10).fill(null), fixed:[]});
}

function rebuildTables(){
  const n=parseInt(document.getElementById('tc-input').value)||9;
  const saved={};
  tables.forEach(t=>t.seats.forEach((g,i)=>{ if(g&&!t.fixed?.includes(g)) saved[g]={tid:t.id,si:i}; }));
  assignment={};
  buildTables(n);
  // pre-assign fixed
  preAssignFixed();
  // restore
  Object.entries(saved).forEach(([gid,{tid,si}])=>{
    const t=tables.find(t=>t.id===tid);
    if(t&&si<t.seats.length&&!t.seats[si]){ t.seats[si]=+gid; assignment[gid]=tid; }
  });
  renderAll(); toast('Tabelas actualizadas');
}

function preAssignFixed(){
  // Honor table: Paula(100), Sabatin(101) fixed seats 0,1
  // Alisson(15) seat 2, Duda is companion — find Duda guest if exists, else mark seat3 for Duda
  const honor=tables.find(t=>t.id==='honor');
  if(honor){
    honor.seats=[100,101,15,null];
    assignment[100]='honor';
    assignment[101]='honor';
    assignment[15]='honor';
    // Duda is Alisson's companion — seat 3 reserved label "Duda"
    honor.seats[3]='duda'; // special placeholder
    assignment['duda']='honor';
  }
}

// ─────────────── RENDER ───────────────
function renderAll(){ renderGuests(); renderTables(); updateStats(); }

function getTableName(tid){ return tables.find(t=>t.id===tid)?.name||''; }

function renderGuests(filter=''){
  const el=document.getElementById('guest-list');
  el.innerHTML='';
  const f=filter.toLowerCase();
  GUESTS.forEach(g=>{
    if(f&&!g.name.toLowerCase().includes(f)&&!g.comp.toLowerCase().includes(f)) return;
    const asgn=assignment[g.id];
    const div=document.createElement('div');
    div.className='gi'+(asgn?' assigned':'');
    div.draggable=!asgn;
    div.dataset.gid=g.id;
    div.innerHTML=`
      ${hasComp(g)?'<span class="couple-tag">💑</span>':''}
      <div class="gi-name">${g.name}</div>
      <div class="gi-meta">
        ${hasComp(g)?`<span class="gi-comp">+${g.comp}</span>`:''}
        <span class="badge ${catBadge(g.cat)}">${g.cat}</span>
        <span>${g.side}</span>
      </div>
      ${asgn?`<div class="assigned-to">→ ${getTableName(asgn)}</div>`:''}`;
    if(!asgn){
      div.addEventListener('dragstart',e=>{ e.dataTransfer.setData('gid',g.id); div.classList.add('dragging'); });
      div.addEventListener('dragend',()=>div.classList.remove('dragging'));
    }
    el.appendChild(div);
  });
  const unassigned=GUESTS.filter(g=>!assignment[g.id]).length;
  document.getElementById('sb-count').textContent=unassigned+' por alocar';
}

function filterGuests(v){ renderGuests(v); }

function renderTables(){
  const grid=document.getElementById('tables-grid');
  grid.innerHTML='';
  tables.forEach(t=>grid.appendChild(makeTableEl(t)));
}

function makeTableEl(t){
  const TW=t.type==='honor'?130:180, TH=t.type==='honor'?55:65;
  // canvas size = space for seats outside + table
  const padH=60+18, padV=60+18; // padding for seats+labels top/bottom
  const padLR=t.type==='regular'?75:20; // extra for left/right seats
  const totalW=TW+padLR*2, totalH=TH+padV*2;
  const cx=totalW/2, cy=totalH/2;
  const positions=getSeatPositions(t.cap, TW, TH, cx, cy);
  const filled=t.seats.filter(s=>s!==null).length;

  const wrap=document.createElement('div');
  wrap.className='table-wrap';

  const nameInp=document.createElement('input');
  nameInp.className='table-name-inp';
  nameInp.value=t.name;
  nameInp.onchange=e=>{ t.name=e.target.value; updateStats(); renderGuests(); };
  wrap.appendChild(nameInp);

  // Rect container
  const rectWrap=document.createElement('div');
  rectWrap.className='table-rect-wrap';
  rectWrap.style.cssText=`width:${totalW}px;height:${totalH}px;position:relative`;

  // Table surface
  const surf=document.createElement('div');
  surf.className=`table-surface ${t.type}`;
  surf.style.cssText=`width:${TW}px;height:${TH}px`;
  surf.innerHTML=`${t.name.replace('Mesa ','M')}<span class="t-count">${filled}/${t.cap}</span>`;
  surf.addEventListener('dragover',e=>{ e.preventDefault(); surf.classList.add('drag-over'); });
  surf.addEventListener('dragleave',()=>surf.classList.remove('drag-over'));
  surf.addEventListener('drop',e=>{ e.preventDefault(); surf.classList.remove('drag-over'); addToTable(+e.dataTransfer.getData('gid'),t.id); });
  surf.addEventListener('click',()=>openModal(t.id));
  rectWrap.appendChild(surf);

  // Seats
  positions.forEach((p,i)=>{
    const gid=t.seats[i];
    const isDuda = gid==='duda';
    const isComp = typeof gid==='string' && gid.startsWith('comp:');
    const mainGid = isComp ? parseInt(gid.split(':')[1]) : null;
    const mainG = isComp ? GUESTS.find(g=>g.id===mainGid) : null;
    const g = (!isDuda && !isComp && gid) ? GUESTS.find(g=>g.id===gid) : null;
    const isFixed = t.fixed?.includes(gid);

    const unit=document.createElement('div');
    unit.className=`seat-unit dir-${p.dir}`;
    unit.style.cssText=`left:${p.x}px;top:${p.y}px`;
    unit.dataset.tid=t.id;
    unit.dataset.si=i;

    const box=document.createElement('div');
    let boxCls='seat-box';
    if(isDuda)   boxCls+=' occ-hon';
    else if(isComp) boxCls+=' occ-coup';
    else if(g){  boxCls += t.type==='honor'?' occ-hon':hasComp(g)?' occ-coup':' occ'; }
    box.className=boxCls;

    // Build seat box content
    if(isDuda){
      const tip=document.createElement('div');
      tip.className='seat-tooltip';
      tip.textContent='Duda — Padrinha';
      box.appendChild(tip);
    } else if(isComp && mainG){
      // Companion seat
      const tip=document.createElement('div');
      tip.className='seat-tooltip';
      tip.innerHTML=`${mainG.comp}<br>Acompanhante de ${mainG.name}`;
      box.appendChild(tip);
      // Remove btn removes the whole couple
      const rm=document.createElement('button');
      rm.className='rm-btn';rm.textContent='×';
      rm.setAttribute('data-tid', t.id);
      rm.setAttribute('data-si', i);
      rm.onclick=function(e){
        e.stopPropagation();
        e.preventDefault();
        removeFromSeat(this.getAttribute('data-tid'), parseInt(this.getAttribute('data-si')));
      };
      box.appendChild(rm);
    } else if(g){
      // Occupied seat
      const tip=document.createElement('div');
      tip.className='seat-tooltip';
      tip.innerHTML=`${g.name}${hasComp(g)?'<br>+'+g.comp:''}<br>${g.cat}${g.obs?'<br>'+g.obs:''}`;
      box.appendChild(tip);
      if(!isFixed){
        const rm=document.createElement('button');
        rm.className='rm-btn';rm.textContent='×';
        rm.setAttribute('data-tid', t.id);
        rm.setAttribute('data-si', i);
        rm.onclick=function(e){
          e.stopPropagation();
          e.preventDefault();
          const tid=this.getAttribute('data-tid');
          const si=parseInt(this.getAttribute('data-si'));
          removeFromSeat(tid, si);
        };
        box.appendChild(rm);
      }
    } else {
      // Empty seat — show + icon, open modal on click
      const plus=document.createElement('span');
      plus.style.cssText='color:rgba(153,205,133,.3);font-size:.9rem;pointer-events:none';
      plus.textContent='+';
      box.appendChild(plus);
      const tip=document.createElement('div');
      tip.className='seat-tooltip';
      tip.textContent=`Clique para adicionar convidado`;
      box.appendChild(tip);
      box.style.cursor='pointer';
      box.addEventListener('dragover',e=>{ e.preventDefault(); box.classList.add('drag-over'); });
      box.addEventListener('dragleave',()=>box.classList.remove('drag-over'));
      box.addEventListener('drop',e=>{ e.preventDefault(); box.classList.remove('drag-over'); addToSeat(+e.dataTransfer.getData('gid'),t.id,i); });
      // Click handled by global delegated listener
    }

    // Label OUTSIDE
    const lbl=document.createElement('div');
    if(isDuda){
      lbl.className='seat-name occ-hon'; lbl.textContent='Duda';
    } else if(isComp && mainG){
      lbl.className='seat-name occ-coup'; lbl.textContent=mainG.comp.split(' ')[0];
    } else if(g){
      lbl.className='seat-name '+(t.type==='honor'?'occ-hon':hasComp(g)?'occ-coup':'occ');
      lbl.textContent=g.name.split(' ')[0];
    } else {
      lbl.className='seat-name empty'; lbl.textContent='+';
    }

    unit.appendChild(box);
    unit.appendChild(lbl);
    rectWrap.appendChild(unit);
  });

  wrap.appendChild(rectWrap);

  // cap bar
  const pct=(filled/t.cap)*100;
  wrap.innerHTML+=`<div class="cap-bar"><div class="cap-fill" style="width:${pct}%;background:${pct>=100?'#c44':'var(--g)'}"></div></div><div class="cap-txt">${filled}/${t.cap}</div>`;
  return wrap;
}

// ─────────────── ASSIGN ───────────────
function addToTable(gid, tid){
  if(assignment[gid]){ toast('Já alocado'); return; }
  const t=tables.find(t=>t.id===tid);
  if(!t) return;
  const empty=t.seats.indexOf(null);
  if(empty===-1){ toast('Mesa cheia!'); return; }
  addToSeat(gid,tid,empty);
}

function addToSeat(gid, tid, si){
  if(!gid||isNaN(gid)) return;
  if(assignment[gid]){ toast('Convidado já alocado'); return; }
  const t=tables.find(t=>t.id===tid);
  if(!t) return;
  if(t.seats[si]!==null){ toast('Lugar ocupado'); return; }

  const g=GUESTS.find(g=>g.id===gid);
  const isCouple = g && hasComp(g);
  const seatsNeeded = isCouple ? 2 : 1;
  const filledCount = t.seats.filter(s=>s!==null).length;

  if(filledCount + seatsNeeded > t.cap){
    toast('Sem lugares suficientes para o casal!'); return;
  }

  // Place main person
  t.seats[si]=gid;
  assignment[gid]=tid;

  // If couple, place companion in next available seat with 'comp:ID' marker
  if(isCouple){
    // find next empty seat after si, wrapping if needed
    let nextSi = -1;
    for(let j=si+1;j<t.seats.length;j++){ if(t.seats[j]===null){ nextSi=j; break; } }
    if(nextSi===-1){ for(let j=0;j<si;j++){ if(t.seats[j]===null){ nextSi=j; break; } } }
    if(nextSi!==-1){
      t.seats[nextSi]='comp:'+gid; // companion placeholder
      toast(`${g.name} + ${g.comp} alocados juntos 💑`);
    } else {
      toast(`${g.name} alocado (sem lugar para ${g.comp})`);
    }
  }
  renderAll();
}

function removeFromSeat(tid, si){
  const t=tables.find(t=>t.id===tid);
  if(!t) return;
  const gid=t.seats[si];
  if(!gid || t.fixed?.includes(gid)) return;

  // If it's a companion placeholder, find and remove both
  if(typeof gid==='string' && gid.startsWith('comp:')){
    const mainId=parseInt(gid.split(':')[1]);
    t.seats[si]=null;
    const mainIdx=t.seats.indexOf(mainId);
    if(mainIdx!==-1){ t.seats[mainIdx]=null; delete assignment[mainId]; }
    renderAll(); toast('Casal removido');
    return;
  }

  // If it's a main guest, also remove companion placeholder
  t.seats[si]=null;
  delete assignment[gid];
  // Remove companion marker (comp:gid)
  for(let j=0;j<t.seats.length;j++){
    if(t.seats[j]==='comp:'+gid){ t.seats[j]=null; break; }
  }
  renderAll(); toast('Removido ✅');
}

// ─────────────── MODAL ───────────────
let mTarget={tid:null,si:null};
function openModal(tid,si=null){
  mTarget={tid,si};
  const t=tables.find(t=>t.id===tid);
  document.getElementById('modal-title').textContent=`Adicionar a ${t.name}`;
  document.getElementById('modal-search').value='';
  renderModalList('');
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal(){ document.getElementById('modal-bg').classList.remove('open'); }
function filterModal(v){ renderModalList(v); }
function renderModalList(f){
  const list=document.getElementById('modal-list'); list.innerHTML='';
  const fl=f.toLowerCase();
  GUESTS.filter(g=>!assignment[g.id]).forEach(g=>{
    if(fl&&!g.name.toLowerCase().includes(fl)&&!g.comp.toLowerCase().includes(fl)) return;
    const d=document.createElement('div'); d.className='mi';
    d.innerHTML=`<div><div class="mi-name">${g.name}${hasComp(g)?` 💑 +${g.comp}`:''}</div><div class="mi-meta">${g.cat} · ${g.side}</div></div><span class="badge ${catBadge(g.cat)}">${g.cat}</span>`;
    d.onclick=()=>{ mTarget.si!==null?addToSeat(g.id,mTarget.tid,mTarget.si):addToTable(g.id,mTarget.tid); closeModal(); };
    list.appendChild(d);
  });
  if(!list.children.length) list.innerHTML='<div style="font-size:.78rem;color:rgba(247,245,238,.3);padding:.8rem;text-align:center">Nenhum disponível</div>';
}

// ─────────────── AUTO ARRANGE ───────────────
function autoArrange(){
  if(!confirm('Distribuir automaticamente? Limpa a organização actual.')) return;
  tables.forEach(t=>{ t.seats=t.seats.map((s,i)=>t.fixed?.includes(s)||s==='duda'?s:null); });
  Object.keys(assignment).forEach(k=>{ if(!tables.some(t=>t.fixed?.includes(+k)||t.seats.includes('duda'&&k==='duda'))) delete assignment[k]; });
  assignment={};
  preAssignFixed();

  const groups=[
    GUESTS.filter(g=>g.cat==='Amigo'&&g.side==='Sabatin'),
    GUESTS.filter(g=>g.cat==='Colega'&&g.side==='Sabatin'),
    GUESTS.filter(g=>g.side==='Sabatin'&&!['Amigo','Colega','Noivos'].includes(g.cat)),
    GUESTS.filter(g=>g.cat==='Família'&&g.side==='Papa'),
    GUESTS.filter(g=>g.cat==='Tio'&&g.side==='Papa'),
    GUESTS.filter(g=>g.cat==='Primo'&&g.side==='Papa'),
    GUESTS.filter(g=>g.cat==='Tio'&&g.side==='Mama'),
    GUESTS.filter(g=>g.cat==='Primo'&&g.side==='Mama'),
    GUESTS.filter(g=>g.side==='Mama'&&!['Tio','Primo','Padrinho'].includes(g.cat)),
  ];

  const reg=tables.filter(t=>t.type==='regular');
  let ti=0;
  groups.forEach(group=>{
    group.forEach(g=>{
      if(assignment[g.id]) return;
      let t=reg[ti];
      if(!t) return;
      if(t.seats.filter(s=>s!==null).length>=t.cap){ ti++; t=reg[ti]; }
      if(t) addToTable(g.id,t.id);
    });
    if(group.length>0&&ti<reg.length-1) ti++;
  });
  renderAll(); toast('Distribuição automática concluída ✅');
}

// ─────────────── CLEAR ───────────────
function clearAll(){
  if(!confirm('Limpar tudo?')) return;
  tables.forEach(t=>{ t.seats=t.fixed?.length?t.seats.map((s,i)=>t.fixed.includes(s)||s==='duda'?s:null):Array(t.cap).fill(null); });
  assignment={};
  preAssignFixed();
  renderAll(); toast('Limpo');
}

// ─────────────── EXCEL ───────────────
function exportExcel(){
  const rows=[['Ordem','Mesa','Nome','Acompanhante','Categoria','Lado','Observação']];
  let n=1;
  tables.forEach(t=>{
    t.seats.forEach(gid=>{
      if(!gid) return;
      if(gid==='duda'){ rows.push([n++,t.name,'Duda','Alisson','Padrinha','Papa','Mesa de Honra']); return; }
      if(typeof gid==='string'&&gid.startsWith('comp:')) return; // companion handled with main
      const g=GUESTS.find(g=>g.id===gid);
      if(g){
        // Check if companion has a seat
        const compSeat = t.seats.some(s=>s==='comp:'+g.id);
        rows.push([n++,t.name,g.name,compSeat?(g.comp||''):'',g.cat,g.side,g.obs]);
        if(compSeat && g.comp) rows.push([n++,t.name,g.comp,g.name,'Acompanhante',g.side,'']);
      }
    });
  });
  GUESTS.forEach(g=>{ if(!assignment[g.id]) rows.push([n++,'— Por alocar —',g.name,g.comp||'',g.cat,g.side,g.obs]); });
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:6},{wch:18},{wch:20},{wch:20},{wch:14},{wch:10},{wch:22}];
  XLSX.utils.book_append_sheet(wb,ws,'Mesas');
  XLSX.writeFile(wb,'mesas-paula-sabatin.xlsx');
  toast('Excel gerado ✅');
}

// ─────────────── STATS ───────────────
function updateStats(){
  // Count by guest entries (couples = 1 entry regardless of 2 seats)
  const assignedGuests = GUESTS.filter(g=>assignment[g.id]).length;
  const total = GUESTS.length;
  const totalSeats = tables.reduce((s,t)=>s+t.cap,0);
  const usedSeats = tables.reduce((s,t)=>s+t.seats.filter(x=>x!==null).length,0);
  document.getElementById('st-tables').textContent=tables.length;
  document.getElementById('st-assigned').textContent=assignedGuests+' casais/pessoas';
  document.getElementById('st-free').textContent=(total-assignedGuests)+' por alocar';
  document.getElementById('st-total').textContent=total+' entradas ('+usedSeats+'/'+totalSeats+' lugares)';
}

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }

// ─────────────── GLOBAL SEAT CLICK HANDLER ───────────────
document.addEventListener('click', function(e){
  // Don't interfere with remove button
  if(e.target.classList.contains('rm-btn')) return;
  const unit = e.target.closest('.seat-unit[data-tid]');
  if(!unit) return;
  const box = unit.querySelector('.seat-box');
  if(!box) return;
  // Only open modal for empty seats
  if(box.classList.contains('occ')||box.classList.contains('occ-hon')||box.classList.contains('occ-coup')) return;
  const tid = unit.dataset.tid;
  const si = parseInt(unit.dataset.si);
  openModal(tid, si);
});

function setSyncStatus(state, msg){
  const bar=document.getElementById('sync-bar');
  const dot=document.getElementById('sync-dot');

  bar.className='saved'; // reset
  bar.classList.add(state);

// Save to Firebase (debounced 800ms)
function saveToFirebase(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    if(isRemoteUpdate) return;
    setSyncStatus('saving','A guardar...');
    const data = {
      tableCount: tables.filter(t=>t.type==='regular').length,
      tableNames: {},
      seats: {}
    };
    tables.forEach(t=>{
      data.tableNames[t.id] = t.name;
      data.seats[t.id] = t.seats.map(s=>s===null?'null':s==='duda'?'duda':String(s));
    });
    mesasRef.set(data)
      .then(()=>setSyncStatus('saved','Guardado · Sincronizado'))
      .catch(e=>setSyncStatus('error','Erro ao guardar: '+e.message));
  }, 800);
}

// Load from Firebase and listen for changes
function listenFirebase(){
  mesasRef.on('value', snap=>{
    const data = snap.val();
    if(!data) {
      setSyncStatus('saved','Novo documento · Pronto');
      return;
    }
    isRemoteUpdate = true;
    // Rebuild tables with saved count
    const n = data.tableCount || 9;
    buildTables(n);
    preAssignFixed();
    // Restore names and seats
    if(data.tableNames){
      tables.forEach(t=>{ if(data.tableNames[t.id]) t.name=data.tableNames[t.id]; });
    }
    if(data.seats){
      assignment = {};
      tables.forEach(t=>{
        const saved = data.seats[t.id];
        if(!saved) return;
        saved.forEach((val,i)=>{
          if(val==='null'||val===null){ t.seats[i]=null; return; }
          if(val==='duda'){ t.seats[i]='duda'; assignment['duda']=t.id; return; }
          if(val.startsWith('comp:')){
            t.seats[i]=val; // keep as comp: string
          } else {
            const gid = parseInt(val);
            if(!isNaN(gid)){ t.seats[i]=gid; assignment[gid]=t.id; }
            else t.seats[i]=null;
          }
        });
      });
    }
    renderAll();
    setSyncStatus('saved','Sincronizado · ' + new Date().toLocaleTimeString('pt',{hour:'2-digit',minute:'2-digit'}));
    setTimeout(()=>{ isRemoteUpdate=false; }, 100);
  });
}

// Track online presence
function trackPresence(){
  const myRef = presenceRef.child(myId);
  myRef.set({t: Date.now()});
  myRef.onDisconnect().remove();
  presenceRef.on('value', snap=>{
    const n = snap.numChildren();
    document.getElementById('online-count').textContent = n>1 ? `👥 ${n} pessoas online` : '';
  });
}

// Patch renderAll to auto-save
const _renderAll = renderAll;
renderAll = function(){
  _renderAll();
  if(!isRemoteUpdate) saveToFirebase();
};

// ─────────────── INIT ───────────────
buildTables(9);
preAssignFixed();
listenFirebase();
trackPresence();
setSyncStatus('saving','A conectar...');
</script>
